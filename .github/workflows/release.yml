name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example, v0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Validate existing release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > /dev/null
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  macos:
    needs: resolve
    name: macOS ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}

      - name: Build
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          cmake --build build --parallel

      - name: Verify binary
        run: |
          build/ovi-code --help
          ctest --test-dir build --output-on-failure
          file build/ovi-code
          otool -L build/ovi-code
          if otool -L build/ovi-code | grep -Eq '/(opt/homebrew|usr/local)/'; then
            echo "Binary links against a Homebrew-only library" >&2
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p stage
          cmake --install build --prefix stage
          mkdir -p package/plugins
          cp stage/bin/ovi-code package/ovi-code
          cp stage/lib/ovi-code/plugins/* package/plugins/
          package/ovi-code plugins | grep -q deliberate
          for notice in LICENSE NOTICE; do
            if [ -f "$notice" ]; then
              cp "$notice" package/
            fi
          done
          tar -C package -czf "ovi-code-darwin-${{ matrix.arch }}.tar.gz" \
            .
          shasum -a 256 "ovi-code-darwin-${{ matrix.arch }}.tar.gz" \
            > "ovi-code-darwin-${{ matrix.arch }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ovi-code-darwin-${{ matrix.arch }}
          path: |
            ovi-code-darwin-${{ matrix.arch }}.tar.gz
            ovi-code-darwin-${{ matrix.arch }}.tar.gz.sha256

  release:
    needs: [resolve, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ovi-code-darwin-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for asset in dist/*; do
              if printf '%s\n' "$assets" | grep -Fxq "$(basename "$asset")"; then
                echo "Keeping existing asset: $(basename "$asset")"
              else
                gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "OVI-CODE $RELEASE_TAG" \
              --verify-tag --generate-notes
          fi

  homebrew:
    needs: release
    uses: ./.github/workflows/homebrew.yml
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
