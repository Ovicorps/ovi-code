site_name: OVI-CODE
site_description: Documentation for the OVI-CODE terminal coding agent
site_url: https://ovicorps.github.io/ovi-code/
repo_url: https://github.com/Ovicorps/ovi-code
repo_name: Ovicorps/ovi-code
edit_uri: edit/main/docs/
exclude_docs: |
  flicker-fixes.md

theme:
  name: material
  language: en
  logo: assets/OviCode.png
  font:
    text: DM Sans
    code: DM Mono
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Using the TUI: user-guide.md
  - Agentic techniques: techniques.md
  - Technique plugins: plugins.md
  - CLI reference: reference.md
  - Troubleshooting: troubleshooting.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

copyright: Copyright &copy; 2026 Ovicorps
